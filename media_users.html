<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self'">
<title>用户分类 · 媒体整理助手</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f6f8;color:#21342e;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1240px;margin:24px auto;padding:0 20px}header{background:#143e32;color:white;padding:26px;border-radius:16px}header a{color:#c5f1de}h1,h2{margin:0 0 10px}h2{font-size:20px}p{margin:8px 0}section{background:white;border:1px solid #dce5df;border-radius:12px;padding:20px;margin:18px 0}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,input,select,.button{font:inherit;padding:9px 12px;border:1px solid #aabbaf;background:white;border-radius:8px;color:#214c39}button,.button{cursor:pointer}.button{display:inline-block;text-decoration:none}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}.primary{background:#216b4c;color:white}.danger{color:#963b26}.muted{color:#60746b;font-size:13px}.error{background:#fff0e6;color:#873c21;padding:12px;border-radius:8px}.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-height:340px;overflow:auto}.user{border:1px solid #dce5df;padding:14px;border-radius:10px;overflow-wrap:anywhere}.user button{padding:5px 9px;margin:7px 7px 0 0}.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.card{border:1px solid #dce5df;padding:12px;border-radius:10px;overflow-wrap:anywhere}.card img,.placeholder{width:100%;height:150px;object-fit:contain;background:#edf3ef;border-radius:8px}.placeholder{display:grid;place-items:center;color:#667c70}.card label{display:flex;gap:8px;font-weight:600;margin:10px 0}.badge{display:inline-block;background:#e6f1e9;border-radius:20px;padding:3px 10px}.path{overflow-wrap:anywhere;font-size:12px;color:#60746b}.card details{margin-top:8px}.pager{display:flex;gap:10px;align-items:center;margin-top:16px}.pager span{flex:1}dialog{width:min(740px,calc(100% - 30px));border:1px solid #aabbaf;border-radius:14px;padding:24px}dialog::backdrop{background:#10251c90}.preview-list{max-height:45vh;overflow:auto;padding-left:22px}.preview-list li{padding:10px 0}dialog input{width:100%}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}nav{display:flex;gap:18px;flex-wrap:wrap}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #62b88d;outline-offset:2px}@media(max-width:600px){main{padding:0 10px}section{padding:14px}.wall{grid-template-columns:repeat(2,minmax(0,1fr))}.controls input,.controls select{max-width:100%}.card{padding:8px}.card img,.placeholder{height:115px}}
</style></head><body>
<div id="user-workspace"></div>
<script>@@ISSUE_LIST@@</script>
<script>mountUserWorkspace(document.getElementById('user-workspace'));</script>
</body></html>
