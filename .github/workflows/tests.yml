name: macOS and Windows tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.9', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install shared media and platform desktop backends
        run: python -m pip install -r requirements.txt
      - name: Compile native macOS backends
        if: runner.os == 'macOS'
        run: |
          swiftc native/image_probe.swift -o native/image_probe
          swiftc native/video_cover.swift -o native/video_cover
      - name: Test with generated sample files
        run: python -X utf8 -m unittest -v
  compatibility:
    name: Dual-platform compatibility
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Python version to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = "success"
