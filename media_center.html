<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; media-src 'self'; frame-src 'self'"><title>Media Organizer · 媒体中心</title><style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#272a36;background:#f6f6f9;color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:1600px;margin:auto;padding:24px 30px}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid #dedee7;background:white;border-radius:9px;padding:9px 12px}button{cursor:pointer}button:hover{background:#f0edf9}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9781db;outline-offset:2px}a{color:#6952ab}.primary{background:#7155b9;color:white;border-color:#7155b9}.danger{color:#a23d45;border-color:#e0bac0}.toolbar,.actions,.chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{margin-bottom:24px}.toolbar input{flex:1;min-width:180px}.view-heading{display:flex;align-items:flex-start;gap:15px;margin:12px 0 22px}.view-heading h1{font-size:28px;margin:0;letter-spacing:-.04em}.view-heading p{color:#7c8091;margin:3px 0}.view-heading .actions{margin-left:auto}h2{font-size:18px;margin:26px 0 14px}h3{margin:10px 0 3px;font-size:14px;line-height:1.45}.muted{color:#808394;font-size:12px}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.count{background:white;border:1px solid #e7e7ee;border-radius:12px;padding:16px 20px;text-align:left;min-width:0}.count:hover{background:#f0edf9;border-color:#b8a9db}.count-link{display:block;color:#6952ab;font-size:12px;margin-top:8px}.count strong{display:block;font-size:28px;margin:2px 0;color:#4c4070}.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;align-items:start}.wall.video-wall{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.wall.photo-wall{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;align-items:stretch}.card{min-width:0;position:relative;break-inside:avoid;margin-bottom:0}.photo-wall .card{display:flex;flex-direction:column}.photo-wall .card-actions{margin-top:auto;padding-top:8px}.cover{display:block;border:0;padding:0;width:100%;overflow:hidden;background:#e9e8ee;border-radius:12px;text-align:left;box-shadow:0 3px 10px #2420370c}.cover img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}.video-wall .cover img{aspect-ratio:16/10}.photo-card .cover{position:relative;aspect-ratio:4/3;flex-shrink:0}.photo-card .cover img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:contain}.photo-card .cover .placeholder{position:absolute;inset:0;height:100%;aspect-ratio:auto}.placeholder{display:grid;place-items:center;aspect-ratio:2/3;background:#e9e6f1;color:#7a6b96;font-size:36px}.video-wall .placeholder,.photo-wall .placeholder{aspect-ratio:16/10}.card .meta{color:#858594;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick{position:absolute;top:8px;left:8px;z-index:1;background:white;border-radius:6px;padding:4px}.pick input{accent-color:#7155b9;width:18px;height:18px;margin:0}.favorite-mark{position:absolute;right:9px;top:9px;background:#fffdf5;color:#a56b19;border-radius:50%;padding:1px 7px;pointer-events:none}.chip{background:#eeebf7;border:0;border-radius:20px;padding:4px 11px;color:#6d579e}.collection{padding:20px;background:white;border:1px solid #e4e3ed;border-radius:12px;text-align:left;min-height:110px;overflow-wrap:anywhere}.collection strong{display:block;font-size:17px;margin-bottom:7px}.section{margin-bottom:30px}.empty{background:white;border:1px dashed #d7d5e0;border-radius:14px;padding:50px 24px;color:#898696;text-align:center}.pager{display:flex;align-items:center;gap:12px;margin:25px 0}.pager span{color:#858594;flex:1;text-align:center}.notice{color:#a04446;background:#fff0ed;border-radius:10px;padding:12px;margin:12px 0}.notice.success{color:#286047;background:#eaf5ed}.notice:empty{display:none}.manage-bar{position:sticky;top:8px;z-index:3;background:#ece8f8;padding:12px;border-radius:12px;margin:12px 0}.manage-bar select{max-width:220px}.manage-bar span{margin-right:auto}dialog{border:1px solid #d7d3e3;border-radius:18px;background:#fcfcfe;color:#272a36;padding:24px;width:min(1050px,95vw);max-height:92vh;overflow:auto}dialog::backdrop{background:#1b1b2d99}.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}.detail-head h2{margin:0;flex:1}.detail-grid{display:grid;grid-template-columns:minmax(180px,32%) 1fr;gap:28px}.detail-art img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px}.detail-grid.photo-detail{grid-template-columns:1fr}.detail-art.photo{grid-column:1/-1}.detail-art.photo img{max-height:60vh}.facts{display:grid;grid-template-columns:90px 1fr;gap:6px 15px;font-size:13px}.facts dt{color:#858594}.facts dd{margin:0;overflow-wrap:anywhere}.file{border-top:1px solid #e7e7ee;margin:12px 0;padding-top:10px;overflow-wrap:anywhere}.file p{font-size:12px;color:#858594}.detail-footer>p{flex-basis:100%;margin:0}.detail-footer>p:empty{display:none}.detail-footer>.actions{width:100%}.detail-footer{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:-24px;background:#fcfcfe;padding:12px 0}.form-grid{display:grid;gap:12px;margin:15px 0}.form-grid label{display:grid;gap:5px}.back{margin-bottom:12px}@media(max-width:700px){main{padding:18px 14px}.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.counts{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.detail-art img{max-height:45vh}.view-heading{flex-wrap:wrap}.view-heading .actions{margin-left:0}.wall.photo-wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.collection-art{height:110px;margin-bottom:8px;border-radius:8px;overflow:hidden;background:#e9e6f1}.collection-art img{width:100%;height:100%;object-fit:cover}.collection-art .placeholder{height:110px;aspect-ratio:auto;font-size:24px}.collection .album-path{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.directory-card{padding:14px 16px;min-height:100px}.directory-card strong::before{content:'▱ ';color:#8d76bc}.album-path{overflow-wrap:anywhere;margin-top:8px;font-size:11px}.browse-settings{margin:-10px 0 16px}.browse-settings>summary{cursor:pointer;color:#797187;font-size:12px}.browse-settings .actions{margin-top:10px}.back{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.back>.album-path{flex-basis:100%}.primary:hover{background:#6245a7;color:white}@media(max-width:700px){.review-files{grid-template-columns:1fr}}.review-group{padding:18px;background:white;border:1px solid #e3dfeb;border-radius:12px;margin:16px 0}.review-group h2{margin:0 0 6px}.review-group .review-files{margin-top:14px}.review-files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.review-file{min-width:0;overflow-wrap:anywhere}.review-file img{width:100%;height:160px;object-fit:contain;background:#f1eff6;border-radius:8px}.review-file .placeholder{height:160px;aspect-ratio:auto}.review-file .actions{margin:10px 0}.search-path{white-space:normal!important;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.card-actions button{font-size:12px;padding:5px 9px}.embedded-center>nav[aria-label="报告导航"]{display:none}.detail-controls{margin:16px 0;gap:12px}.detail-controls input{min-width:0;flex:1}.file .actions{gap:12px}.review-pick{display:flex;gap:8px;align-items:center;margin-bottom:12px}.review-batch{position:sticky;bottom:0;z-index:4;background:#f0ecfa;border:1px solid #d7d3e3;border-radius:12px;padding:14px;gap:12px}.review-batch strong{margin-right:auto}.placeholder{align-content:center;gap:8px}.placeholder small{font-size:12px;line-height:1.6;padding:0 12px;text-align:center}progress{width:100%;height:7px;accent-color:#7155b9;margin:8px 0 12px}</style></head><body><main>
<form id="center-search" class="toolbar" role="search"><input id="query" type="search" aria-label="搜索媒体" placeholder="搜索名称、路径、标签、演员或简介…"><select id="search-scope" aria-label="搜索范围"><option value="view">当前页面</option><option value="all">全部媒体</option></select><select id="media-kind" aria-label="筛选媒体类型"><option value="">全部类型</option><option value="movie">电影</option><option value="video">视频</option><option value="photo">照片</option></select><button>搜索</button><button type="button" id="clear-search" hidden>清除</button></form>
<details class="browse-settings" id="center-options"><summary id="center-options-summary">筛选与排序</summary><div class="actions"><select id="media-order" aria-label="媒体排序"><option value="recent">最近更新</option><option value="oldest">最早更新</option><option value="name">名称</option><option value="size">文件大小从大到小</option></select><select id="filter-year" aria-label="筛选年份"><option value="">全部年份</option></select><select id="filter-genre" aria-label="筛选类型标签"><option value="">全部类型标签</option></select><select id="filter-duration" aria-label="筛选视频时长"><option value="">全部视频时长</option><option value="short">短视频 · 不足10分钟</option><option value="medium">10分钟至不足1小时</option><option value="long">1小时及以上</option><option value="unknown">时长未知</option></select><select id="filter-resolution" aria-label="筛选视频尺寸"><option value="">全部视频尺寸</option><option value="uhd">短边2160像素及以上</option><option value="fhd">短边1080–2159像素</option><option value="hd">短边720–1079像素</option><option value="sd">短边不足720像素</option><option value="unknown">尺寸未知</option></select><button id="reset-filters" type="button" hidden>重置筛选</button></div></details>
<select id="photo-layout" aria-label="照片浏览方式" hidden><option value="wall">照片墙</option><option value="timeline">按月份查看</option></select>
<label id="recursive-label" class="muted" hidden><input id="include-subfolders" type="checkbox"> 包含子文件夹</label>
<div class="view-heading"><div><h1 id="center-title">媒体中心</h1><p id="center-subtitle">正在读取本地资料库…</p></div><div class="actions"><button id="create-collection" hidden>＋ 新建合集</button><button id="manage-toggle" aria-pressed="false">整理模式</button><button id="center-rescan" hidden>重新扫描来源目录</button><button id="center-refresh" aria-label="刷新媒体中心">刷新页面</button></div></div>
<p id="center-status" class="muted" role="status" hidden></p>
<div id="center-error" class="notice" role="alert"></div>
<div id="manage-bar" class="actions manage-bar" hidden><span id="selected-count">已选 0 项</span><button id="select-page">全选本页</button><button id="clear-selection">清空</button><select id="target-collection" aria-label="选择合集"></select><button id="add-collection">加入合集</button><button id="create-selection-collection">新建合集并加入</button><button id="remove-collection" hidden>移出合集</button><button id="compare-selected" disabled>对比两张照片</button><button id="delete-selected" class="danger">移到废纸篓 / 回收站…</button></div>
<p id="preview-progress-label" class="muted" role="status" hidden></p><progress id="preview-progress" max="100" hidden></progress>
<div id="center-breadcrumb" class="back"></div><div id="center-content"></div>
<div class="pager" id="center-pager" hidden><button id="center-prev">上一页</button><span id="center-page"></span><button id="center-next">下一页</button></div>
</main>
<dialog id="media-detail" aria-labelledby="detail-title"><div class="detail-head"><h2 id="detail-title"></h2><button id="detail-close" aria-label="关闭媒体详情">关闭</button></div><div id="detail-content"></div><div class="detail-footer"><p id="detail-feedback" class="muted" role="status"></p><p id="detail-status" class="notice" role="status"></p><div class="actions" id="detail-actions"></div></div></dialog>
<dialog id="collection-form" aria-labelledby="collection-form-title"><h2 id="collection-form-title">新建合集</h2><form id="collection-save"><div class="form-grid"><label>合集名称<input id="collection-name" maxlength="80" required></label></div><p id="collection-help" class="muted"></p><p id="collection-error" class="notice" role="alert"></p><div class="actions"><button type="button" id="collection-cancel">取消</button><button class="primary" id="collection-submit">保存</button></div></form></dialog>
<script>@@MEDIA_CENTER@@</script></body></html>
